---
- name: Seal the Misskey token from an Ansible Vault source
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    secret_dir: manifests/sumire
    sealed_secrets_cert: "{{ playbook_dir }}/../manifests/cloudflare-tunnel-controller/pub-cert.pem"
  vars_files:
    - "{{ playbook_dir }}/../{{ secret_dir }}/vault.yml"
  tasks:
    - name: Read the raw Vault source without decrypting it
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../{{ secret_dir }}/vault.yml"
      register: vault_source
      no_log: true

    - name: Require an encrypted Vault source
      ansible.builtin.assert:
        that:
          - (vault_source.content | b64decode).startswith('$ANSIBLE_VAULT;')
        fail_msg: Encrypt vault.yml with ansible-vault before sealing.
      no_log: true

    - name: Select the Misskey Secret safely
      block:
        - name: Require one unambiguous source format
          ansible.builtin.assert:
            that:
              - (secret_manifest is defined) != (secret_manifests is defined)
              - secret_manifest is defined or (secret_manifests | map(attribute='metadata.name') | difference(['sumire-misskey', 'sumire-opencode-auth', 'ghcr-pull']) | length == 0)
          no_log: true

        - name: Select the single Secret or the Misskey entry from an older Vault
          ansible.builtin.set_fact:
            sumire_secret_candidates: "{{ [secret_manifest] if secret_manifest is defined else secret_manifests | selectattr('metadata.name', 'equalto', 'sumire-misskey') | list }}"
          no_log: true

        - name: Require exactly one Misskey Secret
          ansible.builtin.assert:
            that:
              - sumire_secret_candidates | length == 1
          no_log: true

        - name: Select the credential to seal
          ansible.builtin.set_fact:
            sumire_secret: "{{ sumire_secret_candidates | first }}"
          no_log: true
      rescue:
        - name: Explain invalid Vault structure without exposing values
          ansible.builtin.fail:
            msg: Use secret_manifest from vault.example.yml. An older secret_manifests list is also accepted if it contains exactly one sumire-misskey entry; retired OpenCode and GHCR entries are ignored.

    - name: Validate the Misskey credential safely
      block:
        - name: Require a valid Secret and a nonempty token
          ansible.builtin.assert:
            that:
              - sumire_secret.apiVersion == 'v1'
              - sumire_secret.kind == 'Secret'
              - sumire_secret.metadata.name == 'sumire-misskey'
              - sumire_secret.metadata.namespace == 'sumire'
              - sumire_secret.type | default('Opaque') == 'Opaque'
              - sumire_secret.stringData is mapping
              - sumire_secret.stringData.token is string
              - sumire_secret.stringData.token | trim | length > 0
          no_log: true
      rescue:
        - name: Explain invalid credentials without exposing the token
          ansible.builtin.fail:
            msg: "sumire-misskey requires apiVersion=v1, kind=Secret, namespace=sumire, type=Opaque, and a nonempty stringData.token. Edit vault.yml with ansible-vault edit; the token stays hidden."

    - name: Seal only the Misskey Secret with the cluster public certificate
      ansible.builtin.command:
        argv:
          - kubeseal
          - --cert
          - "{{ sealed_secrets_cert }}"
          - --format
          - json
          - --scope
          - strict
        stdin: "{{ sumire_secret | to_json }}"
      register: sealed
      changed_when: true
      no_log: true

    - name: Write the SealedSecret
      ansible.builtin.copy:
        content: "{{ sealed.stdout | from_json | to_nice_yaml(indent=2) }}"
        dest: "{{ playbook_dir }}/../{{ secret_dir }}/sealedsecret.yaml"
        mode: '0644'
      no_log: true

    - name: Include the generated file in Kustomize
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../{{ secret_dir }}/kustomization.yaml"
        regexp: '^  # - sealedsecret\.yaml.*$'
        line: '  - sealedsecret.yaml'
        insertafter: '^  - pvc\.yaml$'
