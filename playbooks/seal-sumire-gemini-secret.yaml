---
- name: Seal the optional Gemini API key for the Antigravity CLI backend
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    secret_dir: manifests/sumire
    sealed_secrets_cert: "{{ playbook_dir }}/../manifests/cloudflare-tunnel-controller/pub-cert.pem"
  vars_files:
    - "{{ playbook_dir }}/../{{ secret_dir }}/vault-gemini.yml"
  tasks:
    - name: Read the raw Vault source
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../{{ secret_dir }}/vault-gemini.yml"
      register: vault_source
      no_log: true

    - name: Require an encrypted Vault source and the expected nonempty credential
      block:
        - name: Validate the Gemini Secret without disclosing its contents
          ansible.builtin.assert:
            that:
              - (vault_source.content | b64decode).startswith('$ANSIBLE_VAULT;')
              - gemini_secret_manifest.apiVersion == 'v1'
              - gemini_secret_manifest.kind == 'Secret'
              - gemini_secret_manifest.metadata.name == 'sumire-gemini'
              - gemini_secret_manifest.metadata.namespace == 'sumire'
              - gemini_secret_manifest.type | default('Opaque') == 'Opaque'
              - gemini_secret_manifest.stringData['api-key'] is string
              - gemini_secret_manifest.stringData['api-key'] | trim | length > 0
          no_log: true
      rescue:
        - name: Explain the expected source format
          ansible.builtin.fail:
            msg: Encrypt vault-gemini.yml with ansible-vault and use vault-gemini.example.yml with a nonempty Gemini API key. Secret values remain hidden.

    - name: Seal the Gemini Secret with the cluster public certificate
      ansible.builtin.command:
        argv: [kubeseal, --cert, "{{ sealed_secrets_cert }}", --format, json, --scope, strict]
        stdin: "{{ gemini_secret_manifest | to_json }}"
      register: sealed
      changed_when: true
      no_log: true

    - name: Write the SealedSecret
      ansible.builtin.copy:
        content: "{{ sealed.stdout | from_json | to_nice_yaml(indent=2) }}"
        dest: "{{ playbook_dir }}/../{{ secret_dir }}/sealedsecret-gemini.yaml"
        mode: '0644'
      no_log: true

    - name: Include the generated file in Kustomize
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../{{ secret_dir }}/kustomization.yaml"
        regexp: '^  # - sealedsecret-gemini\.yaml.*$'
        line: '  - sealedsecret-gemini.yaml'
        insertafter: '^resources:$'
