---
- name: Seal an Ansible Vault backed Kubernetes Secret
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../{{ secret_dir }}/vault.yml"
  tasks:
    - name: Require a Secret manifest and explicit namespace
      ansible.builtin.assert:
        that:
          - secret_manifest.apiVersion == 'v1'
          - secret_manifest.kind == 'Secret'
          - secret_manifest.metadata.name | length > 0
          - secret_manifest.metadata.namespace | length > 0
          - secret_manifest.stringData is defined or secret_manifest.data is defined
        fail_msg: vault.yml must contain secret_manifest with an explicit namespace.
      no_log: true

    - name: Seal with this cluster's public certificate
      ansible.builtin.command:
        argv:
          - kubeseal
          - --cert
          - "{{ playbook_dir }}/../manifests/cloudflare-tunnel-controller/pub-cert.pem"
          - --format
          - yaml
          - --scope
          - strict
        stdin: "{{ secret_manifest | to_json }}"
      register: sealed
      changed_when: true
      no_log: true

    - name: Write the SealedSecret
      ansible.builtin.copy:
        content: "{{ sealed.stdout }}\n"
        dest: "{{ playbook_dir }}/../{{ secret_dir }}/sealedsecret.yaml"
        mode: '0644'
      no_log: true
