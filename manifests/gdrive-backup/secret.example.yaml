apiVersion: v1
kind: Secret
metadata:
  name: rclone-config
  namespace: backup-system
type: Opaque
stringData:
  rclone.conf: |
    [gdrive]
    type = drive
    client_id = YOUR_CLIENT_ID
    client_secret = YOUR_CLIENT_SECRET
    scope = drive.file
    token = {"access_token":"...","token_type":"Bearer","refresh_token":"...","expiry":"..."}
    team_drive =
