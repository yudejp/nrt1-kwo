apiVersion: apps/v1
kind: Deployment
metadata:
  name: sumire
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sumire
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sumire
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-opencode-auth
          image: ghcr.io/yude/sumire:main
          args: [init-opencode-auth, /run/sumire-opencode/password]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: opencode-runtime
              mountPath: /run/sumire-opencode
      containers:
        - name: sumire
          image: ghcr.io/yude/sumire:main
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sumire-config
          env:
            - name: DATA_DIR
              value: /data
            - name: OPENCODE_PASSWORD_FILE
              value: /run/sumire-opencode/password
            - name: MISSKEY_TOKEN_FILE
              value: /var/run/sumire-secrets/token
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: opencode-runtime
              mountPath: /run/sumire-opencode
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /var/run/sumire-secrets
              readOnly: true
        - name: opencode
          image: ghcr.io/yude/sumire-opencode:main
          env:
            - name: OPENCODE_PASSWORD_FILE
              value: /run/sumire-opencode/password
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: sumire-config
                  key: LLM_MODEL
          ports:
            - name: model-api
              containerPort: 4096
          # The API is loopback-only; its credential is generated by the init container.
          startupProbe:
            exec:
              command: [sh, -c, 'nc -z 127.0.0.1 4096']
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [sh, -c, 'nc -z 127.0.0.1 4096']
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            runAsUser: 10002
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: opencode-runtime
              mountPath: /run/sumire-opencode
              readOnly: true
            - name: model-data
              mountPath: /state
            - name: model-tmp
              mountPath: /tmp
            - name: model-config
              mountPath: /etc/sumire
              readOnly: true
            - name: workspace
              mountPath: /workspace
              readOnly: true
      volumes:
        - name: opencode-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: sumire-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: credentials
          secret:
            secretName: sumire-misskey
            defaultMode: 0440
        - name: model-data
          persistentVolumeClaim:
            claimName: sumire-opencode-data
        - name: model-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: model-config
          configMap:
            name: sumire-opencode-config
        - name: workspace
          configMap:
            name: sumire-workspace
