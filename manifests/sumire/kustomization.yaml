apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - pvc-antigravity.yaml
  - service.yaml
  - cloudflare-ingress.yaml
  - sealedsecret.yaml
  - sealedsecret-groq.yaml
  # - sealedsecret-gemini.yaml # Optional: playbooks/seal-sumire-gemini-secret.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: sumire
    path: patch-antigravity.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: sumire

configMapGenerator:
  - name: sumire-config
    namespace: sumire
    literals:
      - MISSKEY_URL=https://misskey.y2e.org
      - LLM_MODEL=antigravity/gemini-4-neon-high
      - LLM_FALLBACK_MODELS=
      - GROQ_FREE_TIER_CONFIRMED=true
      - ANTIGRAVITY_AGENT=
      - ANTIGRAVITY_EFFORT=
      - DRY_RUN=false
      - POLL_INTERVAL=15s
      - GENERATE_TIMEOUT=3m
      - MAX_REPLY_CHARS=400
      - MAX_QUEUE=1000
      - DAILY_ENABLED=true
      - DAILY_AT=20:00
      - DAILY_MIN_NOTES=3
      - DAILY_MIN_AUTHORS=2
  - name: sumire-opencode-config
    namespace: sumire
    files:
      - opencode/opencode.json
      - opencode/quota-pool.mjs
      - opencode/package.json
      - opencode/persona.md
  - name: sumire-workspace
    namespace: sumire
    files:
      - opencode/facts.txt
  - name: sumire-antigravity-workspace
    namespace: sumire
    files:
      - AGENTS.md=opencode/persona.md
      - facts.txt=opencode/facts.txt

# All images were built from dbef6f2 and verified by CI 45559732427.
images:
  - name: ghcr.io/yude/sumire
    digest: sha256:0c79d986cbe55f0a1605074a3cdaf52705ed4176ed32600c9507904f1368c40f
  - name: ghcr.io/yude/sumire-opencode
    digest: sha256:4853304d18928a91b0bd680e3f445b72308ee396952ca4975297667d6b0a0b27
  - name: ghcr.io/yude/sumire-antigravity
    digest: sha256:8ab54f6f83bf13e4bf6bb679e2950de92ad120d14c9e1834178de79abc25ef96
