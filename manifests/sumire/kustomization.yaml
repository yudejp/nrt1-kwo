apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sumire
resources:
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - sealedsecret.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: sumire

configMapGenerator:
  - name: sumire-config
    literals:
      - MISSKEY_URL=https://misskey.y2e.org
      - LLM_MODEL=opencode/flint-40b-free
      - DRY_RUN=false
      - POLL_INTERVAL=15s
      - GENERATE_TIMEOUT=3m
      - MAX_REPLY_CHARS=400
      - MAX_QUEUE=1000
      - DAILY_ENABLED=true
      - DAILY_AT=20:00
      - DAILY_MIN_NOTES=3
      - DAILY_MIN_AUTHORS=2
  - name: sumire-opencode-config
    files:
      - opencode/opencode.json
      - opencode/persona.md
  - name: sumire-workspace
    files:
      - opencode/facts.txt

images:
  - name: ghcr.io/yude/sumire
    digest: sha256:d2b49ad963662515f7e76c86643787db022e8ff076e7f06407e4fcbe49bd0881
  - name: ghcr.io/yude/sumire-opencode
    digest: sha256:bbd8af29aae2dd5d2f8245e345fe92ff3ae3001ef68f5b448d1480fa2120b1b2
