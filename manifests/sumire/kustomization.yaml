apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sumire
resources:
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - sealedsecret.yaml
  - sealedsecret-groq.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: sumire

configMapGenerator:
  - name: sumire-config
    literals:
      - MISSKEY_URL=https://misskey.y2e.org
      - LLM_MODEL=opencode/flint-40b-free
      - LLM_FALLBACK_MODELS=groq/openai/gpt-oss-20b
      - GROQ_FREE_TIER_CONFIRMED=true
      - DRY_RUN=false
      - POLL_INTERVAL=15s
      - GENERATE_TIMEOUT=3m
      - MAX_REPLY_CHARS=400
      - MAX_QUEUE=1000
      - DAILY_ENABLED=true
      - DAILY_AT=20:00
      - DAILY_MIN_NOTES=3
      - DAILY_MIN_AUTHORS=2
  - name: sumire-opencode-config
    files:
      - opencode/opencode.json
      - opencode/quota-pool.mjs
      - opencode/package.json
      - opencode/persona.md
  - name: sumire-workspace
    files:
      - opencode/facts.txt

images:
  - name: ghcr.io/yude/sumire
    digest: sha256:75a19281737c6d0fc99ceda3ca804dfe20bd1c07c51cf5f58004affb6ad0ab60
  - name: ghcr.io/yude/sumire-opencode
    digest: sha256:2574acbbee17ababbbfd3a32052b5831fa57326e92157dd15bf9577802fb5324
