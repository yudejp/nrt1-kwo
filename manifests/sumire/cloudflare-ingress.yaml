apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-sumire
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: sumire.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-sumire
  namespace: sumire
spec:
  ingressClassName: traefik
  rules:
    - host: sumire.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sumire
                port:
                  number: 80
