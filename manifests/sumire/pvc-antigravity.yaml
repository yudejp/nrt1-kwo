apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: sumire
  name: sumire-antigravity-data
  labels:
    gdrive-backup.k8s.y2e.org/enabled: "true"
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: sumire
  name: sumire-antigravity-state
  labels:
    gdrive-backup.k8s.y2e.org/enabled: "true"
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
