apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-swarm-checkin-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: swarm-checkin.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-swarm-checkin-1
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: swarm-checkin.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swarm-checkin
                port:
                  number: 80
