apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-misskey-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: misskey.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-misskey-1
  namespace: misskey-y2e-org
spec:
  ingressClassName: traefik
  rules:
    - host: misskey.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
