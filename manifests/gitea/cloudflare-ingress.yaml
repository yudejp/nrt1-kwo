apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-gitea-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: git.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-gitea-1
  namespace: gitea
spec:
  ingressClassName: traefik
  rules:
    - host: git.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-service
                port:
                  number: 3000
