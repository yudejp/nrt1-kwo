apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-gri-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: gri.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-gri-1
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: gri.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gri
                port:
                  number: 9292
