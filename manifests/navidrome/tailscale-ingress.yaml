apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nrt1-navidrome
  namespace: default
  annotations:
    tailscale.com/proxy-group: nrt1-ingress
    tailscale.com/tags: tag:sh
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: navidrome
      port:
        number: 80
  tls:
    - hosts:
        - nrt1-navidrome
