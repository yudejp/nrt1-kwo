apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-nrt1ws2-rdp
  namespace: default
  annotations:
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: http
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: nrt1ws2.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rdp-web
                port:
                  name: http
