apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-victoriametrics-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: vm.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-victoriametrics-1
  namespace: vm
spec:
  ingressClassName: traefik
  rules:
    - host: vm.yude.jp.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmagent-agent
                port:
                  number: 8429
