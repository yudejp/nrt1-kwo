apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-growi-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: w.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-growi-1
  namespace: growi
spec:
  ingressClassName: traefik
  rules:
    - host: w.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: growi
                port:
                  number: 80
