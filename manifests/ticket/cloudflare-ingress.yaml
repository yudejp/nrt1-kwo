apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-ticket-1
  namespace: kube-system
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: ticket.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ticket-1
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: ticket.y2e.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redmine
                port:
                  number: 80
