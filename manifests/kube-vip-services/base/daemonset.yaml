apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-services
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip-services
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-services
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: kube-vip-services
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.3.1@sha256:1962f9daf226503f7e6b107f595cb28b7917fd2d0113957075e19a3e5a6c1e33
          args: [manager]
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: 127.0.0.1
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: cp_enable
              value: "false"
            - name: svc_enable
              value: "true"
            - name: lb_enable
              value: "false"
            - name: vip_arp
              value: "true"
            - name: vip_subnet
              value: "32"
            - name: svc_election
              value: "true"
            - name: lb_class_legacy_handling
              value: "false"
            - name: lb_class_name
              value: kube-vip.io/kube-vip-class
            - name: prometheus_server
              value: ""
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
